<style>
:root{
  --bg:#090B0A;--side:#0C0F0D;--card:#121614;--raised:#181D1A;--input:#0C0F0D;--line:#242B27;--line2:#1C221F;--line3:#38423D;
  --text:#ECF1EE;--sub:#C8D1CC;--muted:#94A09A;--faint:#6D7973;

  --amber:#FFC266;--amber-bg:#221B0E;--amber-bd:#5C4316;
  --red:#FF8A8A;--red-t:#FFC4C4;--red-bg:#1E1214;--red-bd:#5A2A2E;
  --blue:#9DB8FF;--blue-bg:#141B2C;--blue-bd:#2C3B66;

  --shade:#000a;color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#F3F5F4;--side:#FFFFFF;--card:#FFFFFF;--raised:#F6F8F7;--input:#FFFFFF;--line:#DCE2DF;--line2:#E7EBE9;--line3:#B8C2BD;
  --text:#111714;--sub:#2E3934;--muted:#5C6862;--faint:#85908A;
  --mint:#14945F;--mint-t:#0E7A4D;--mint-bg:#E4F4EC;--mint-bd:#A6DBC2;--on-mint:#FFFFFF;
  --amber:#9A6100;--amber-bg:#FFF5E0;--amber-bd:#EFD39A;
  --red:#C2362C;--red-t:#9B2C24;--red-bg:#FDEDEB;--red-bd:#F1C2BD;
  --blue:#2457C9;--blue-bg:#EAF0FC;--blue-bd:#BDD0F3;
  --violet:#6A4BC4;--violet-bg:#F1ECFC;--violet-bd:#D6CAF3;
  --shade:#1118144d;color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;font-family:'Space Grotesk',Inter,sans-serif;letter-spacing:-0.01em}
.app{min-height:100vh;display:flex}
.side{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh}
.content{flex:1;padding:18px 20px 96px;display:flex;flex-direction:column;gap:20px;max-width:560px;width:100%;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;height:calc(72px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--side);border-top:1px solid var(--line2);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));z-index:5}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:500;color:var(--muted)}
.tab.on{color:var(--mint);font-weight:600}
.tab svg{width:22px;height:22px}
.tab.center{justify-content:flex-end;padding-bottom:10px;color:var(--sub);white-space:nowrap;font-size:10.5px;letter-spacing:-0.01em}
.tab .fab{width:54px;height:54px;border-radius:18px;background:var(--mint);color:var(--on-mint);display:flex;align-items:center;justify-content:center;margin-top:-30px;margin-bottom:2px;box-shadow:0 6px 18px rgba(61,220,151,.28),0 0 0 6px var(--side)}
.tab .fab svg{width:26px;height:26px}
.sheet-bg{position:fixed;inset:0;background:rgba(4,8,16,.66);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px}
.pad{padding:16px}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.muted{color:var(--muted)}.sub{color:var(--sub)}
.small{font-size:13px}.xs{font-size:12px}
.title{font-size:26px;font-weight:700}
.btn{height:48px;border-radius:14px;border:1px solid var(--line);background:var(--raised);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px}
.btn.primary{background:var(--mint);border-color:var(--mint);color:var(--on-mint);font-weight:700}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;border-color:var(--red-bd);color:var(--red)}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid}
.c-done{background:var(--mint-bg);color:var(--mint-t);border-color:var(--mint-bd)}
.c-test{background:rgba(120,200,255,.08);color:var(--blue);border-color:rgba(120,200,255,.35)}
.c-dev{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-bd)}
.c-plan{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-bd)}
.c-disp{background:var(--violet-bg);color:var(--violet);border-color:var(--violet-bd)}
.c-gray{background:var(--raised);color:var(--sub);border-color:var(--line)}
.pill{height:36px;padding:0 14px;border-radius:18px;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--sub)}
.pill.on{border-color:var(--mint);background:var(--mint-bg);color:var(--mint-t)}
.seg{height:48px;border-radius:14px;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--card)}
.seg.on{border-color:var(--mint);background:var(--mint-bg);color:var(--mint-t)}
.list>*{padding:13px 0;border-bottom:1px solid var(--line2)}
.list>*:last-child{border-bottom:0}
.listcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:2px 16px}
.icon{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.toggle{width:52px;height:32px;border-radius:16px;border:0;padding:0 4px;display:flex;align-items:center;flex:none;background:var(--line);justify-content:flex-start}
.toggle span{width:24px;height:24px;border-radius:50%;background:var(--muted)}
.toggle.on{background:var(--mint);justify-content:flex-end}
.toggle.on span{background:var(--on-mint)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;line-height:1.7;white-space:pre-line;background:var(--bg);border:1px solid var(--line2);border-radius:14px;padding:14px;color:var(--text)}
.back{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.faq{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.faq.open{border-color:var(--blue-bd);background:var(--raised)}
.faq button.q{width:100%;min-height:52px;padding:12px 14px;border:0;background:transparent;display:flex;align-items:center;gap:12px;text-align:left}
.sign{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;background:var(--raised);flex:none}
.faq.open .sign{background:var(--mint);color:var(--on-mint)}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.tbl{overflow-x:auto}
.trow{width:100%;display:grid;grid-template-columns:minmax(150px,1.2fr) 110px 140px minmax(180px,1.5fr) 140px;gap:12px;align-items:center;padding:12px 16px;text-align:left;border:0;border-bottom:1px solid var(--line2);background:transparent}
.trow.on{background:var(--raised);box-shadow:inset 0 0 0 1px var(--blue-bd)}
.thead{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.board{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.desk-only{display:none}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:min(92vw,420px);background:var(--raised);border:1px solid var(--line);color:var(--text);padding:12px 16px;border-radius:14px;font-size:14px;line-height:1.4;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.4)}
@media (min-width: 900px){
  .app.wide .side{display:flex;flex-direction:column;gap:18px;width:240px;flex:none;background:var(--side);border-right:1px solid var(--line2);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}

  .app.wide .content{max-width:1320px;padding:24px 28px 40px}
  .app.wide .desk-only{display:flex}
  .navbtn{height:42px;padding:0 12px;border-radius:12px;border:0;background:transparent;display:flex;align-items:center;gap:10px;font-size:15px;color:var(--sub);text-align:left;width:100%}
  .navbtn.on{background:var(--raised);color:var(--text);font-weight:700}
  .navbtn svg{width:18px;height:18px;flex:none}

    '<div class="grid2" style="position:sticky;bottom:-18px;background:var(--card);padding:10px 0 4px"><button class="btn" style="height:48px" data-act="drcancel">Отмена</button><button class="btn primary" style="height:48px;font-size:15px" data-act="drsave">' + (busy ? '…' : 'Добавить как Upcoming') + '</button></div></div></div>';
}
async function draftSave() {
  if (S.busy) return;
  S.busy = 'draft'; render();
  const clean = (o) => { if (typeof o === 'string') return /^(\/var\/folders\/|\/Users\/|\/private\/|file:\/\/|[A-Za-z]:\\)/.test(o.trim()) ? '' : o; if (Array.isArray(o)) return o.map(clean); if (o && typeof o === 'object') { const r = {}; for (const k in o) r[k] = clean(o[k]); return r; } return o; };
  S.draft.load = clean(S.draft.load);
  try { const j = await apiCall('/api/draft/save', { id: S.draft.id, load: S.draft.load }); S.draft = null; S.addL = S.addL || { mode: 'file', text: '', f: {} }; S.addRes = { ok: j.ok, texts: j.texts || [] }; }
  catch (e) { apiFail(e); return; }
  S.busy = ''; render();
}
async function draftCancel() {
  const id = S.draft && S.draft.id; S.draft = null; render();
  if (id) { try { await apiCall('/api/draft/cancel', { id }); } catch (e) {} }
  toast('Груз не добавлен');
}
function draftFromReply(j) {
  if (j && j.draft && j.load) { S.draft = { id: j.draft, load: j.load, missing: j.missing || [] }; S.addL = null; S.addRes = null; return true; }
  return false;
}
function draftAfterRender() {
  document.querySelectorAll('[data-dr]').forEach((el) => ['input', 'change'].forEach((ev) => el.addEventListener(ev, () => { const p = el.dataset.dr; drSet(p, p === 'rate' ? (parseFloat(el.value) || 0) : el.value); })));
}
function draftClick(d) {
  if (d.act === 'drsave') { draftSave(); return true; }
  if (d.act === 'drcancel') { draftCancel(); return true; }
  return false;
}

"Расчёт ETA":"ETA calculation","От GPS трака до стопа: пробки, часы водителя, погода":"From truck GPS to the stop: traffic, driver hours, weather","Посчитать ETA":"Calculate ETA","Номер трака, например 2080":"Truck number, for example 2080","Адрес стопа, например PDX9, Troutdale, OR":"Stop address, for example PDX9, Troutdale, OR","Appointment по времени стопа, например 21.11 16:20":"Appointment in stop time, for example 21.11 16:20","Штат в адресе (OR, TX...) нужен, чтобы знать часовой пояс стопа. Appointment можно не писать.":"The state in the address (OR, TX...) tells the stop time zone. The appointment is optional.","Посчитать в чате с ботом":"Calculate in the bot chat","Ответ придёт в чат с ботом.":"The answer comes to the bot chat.","Ответ придёт в чат с ботом. Пока /eta работает только у владельца бота: GPS берётся из его Samsara. У вас заработает после подключения вашего ELD на сервере (в плане).":"The answer comes to the bot chat. For now /eta works only for the bot owner: GPS comes from the owner's Samsara. It works for you after your ELD is connected on the server (planned).","Пример разбора: Load 1042":"Sample breakdown: Load 1042","Напишите номер трака и адрес стопа":"Write the truck number and the stop address","Команда скопирована: вставьте её в чат и отправьте":"Command copied: paste it in the chat and send","Окно и бот переключаются на этот язык":"The window and the bot switch to this language","Написать в поддержку":"Write to support","Все команды бота":"All bot commands",

"Активация":"Activation","Опрос":"Survey","7 коротких вопросов в чате с ботом":"7 short questions in the bot chat","Выбрать и оплатить":"Pick and pay","Ключ на проверке":"Key being checked","Бот добавлен хотя бы в одну группу":"The bot is in at least one group","Настройки уже можно менять. Апдейты включатся после всех шагов.":"You can change settings already. Updates turn on after all steps.","Отправить ключ заново":"Send the key again","Ключ ELD на проверке":"ELD key being checked","Ключ получен и проверяется. Как только он заработает, апдейты можно будет включить. Если ключ неверный, отправьте новый.":"The key is received and being checked. Once it works you can turn updates on. If the key is wrong, send a new one.","Почему некоторые кнопки с замком?":"Why do some buttons have a lock?","Пока активация не закончена, часть функций закрыта, чтобы ничего не сломать. Шаги: опрос, тариф, ELD, хотя бы одна группа водителя. Нажмите на кнопку с замком: окно подскажет, какой шаг остался, и даст кнопку, чтобы его сделать. Например, ELD подключается командой /eld":"Until activation is finished some features are closed so nothing breaks. Steps: survey, plan, ELD, at least one driver group. Tap a locked button: the window tells you which step is left and gives a button to do it. For example, the ELD is connected with /eld","Ключ, чтобы бот видел, где траки":"A key so the bot sees where trucks are","Пока активация не закончена, окно работает только для просмотра.":"Until activation is finished the window is view-only.","Сначала пройдите опрос":"Finish the survey first","Это 7 коротких вопросов в чате с ботом: борд, грузы, ELD, коллеги, часовой пояс, смена, число водителей. После него функции включатся. Смотреть окно можно и сейчас.":"It is 7 short questions in the bot chat: board, freight, ELD, teammates, time zone, shift, number of drivers. Then features turn on. You can look around the window already.","Выбрать тариф":"Pick a plan","Выберите и оплатите тариф":"Pick and pay for a plan","Функции включатся после оплаты. Смотреть окно, тарифы и инструкцию можно и сейчас.":"Features turn on after payment. You can look at the window, plans and guide already.","Подключите ELD":"Connect your ELD","Подключить ELD":"Connect ELD","Без ELD бот не видит, где траки, и апдейты будут без местоположения. Бот спросит, какой у вас ELD, и проверит ключ. Это пара минут.":"Without an ELD the bot cannot see where trucks are and updates have no location. The bot asks which ELD you have and checks the key. It takes a couple of minutes.","Добавьте бота в группу водителя":"Add the bot to a driver group","Апдейты идут в группы водителей. Добавьте бота хотя бы в одну группу, и он сам проверит, видит ли сообщения.":"Updates go to driver groups. Add the bot to at least one group and it checks by itself whether it can read messages.","Как добавить":"How to add","Пройти опрос":"Take survey","Группы водителей":"Driver groups","Тариф":"Plan","Понятно":"Got it",
"Окно переключается на этот язык. Язык ответов бота: /start":"The window switches to this language. The bot's reply language: /start","Окно переключается на этот язык":"The window switches to this language",
"Рабочее время и часовой пояс":"Working time and time zone","Можно взять выходной на несколько дней?":"Can I take several days off?","Да, в любой момент: «Настройки» → «Рабочее время» → календарь «Разовые выходные». Нажмите на нужные даты и «Сохранить даты». Или командой, например: /off 25.11-27.11 или /off 3. В эти дни бот не пишет в группы и не шлёт сигналы, а когда вы вернётесь, пришлёт сводку.":"Yes, at any time: “Settings” → “Working time” → the “One-off days off” calendar. Tap the dates and “Save dates”. Or with a command, for example: /off 25.11-27.11 or /off 3. On those days the bot does not post in groups or send alerts, and sends a summary when you are back.","Разовые даты":"One-off dates","Разовые выходные и длинные дни":"One-off days off and long days","Нажмите на дату: рабочий день станет выходным, а выходной по неделе станет разово рабочим. Например, отпуск на 3 дня.":"Tap a date: a working day becomes a day off, and a weekly day off becomes a one-off working day. For example, a 3-day vacation.","Нажмите на дату: рабочий день станет выходным (ещё нажатие: 12 ч), а выходной по неделе станет разово рабочим. Например, отпуск на 3 дня.":"Tap a date: a working day becomes a day off (tap again: 12 h), and a weekly day off becomes a one-off working day. For example, a 3-day vacation.","раб":"on","вых":"off","Цветом отмечены разовые изменения. Остальные дни идут по дням недели.":"Colored dates are one-off changes. Other days follow the weekdays.","Сохранить даты":"Save dates","Командой: /off 25.11-27.11 или /off 3 (три дня с сегодня)":"By command: /off 25.11-27.11 or /off 3 (three days from today)","Бот только анализирует. Сводка придёт в начале смены.":"The bot only analyses. A summary comes when the shift starts.",
"«Настройки» → «Рабочее время» → «Часовой пояс»: США (EST, CST, MST, PST и другие), все зоны России, Узбекистан и соседние страны, Турция, Европа. Или командой, например: /tz us-e":"“Settings” → “Working time” → “Time zone”: USA (EST, CST, MST, PST and more), every Russian zone, Uzbekistan and neighbours, Türkiye, Europe. Or with a command, for example: /tz us-e","Перерыв считает сам бот: рабочее окно делится на число апдейтов в тарифе, от 2 до 4 часов. Для 24/7 это обычно 4 часа, для смены 8 ч на 4 апдейта — 2 часа.":"The bot works out the gap itself: the working window divided by the plan's number of updates, from 2 to 4 hours. For 24/7 it is usually 4 hours, for an 8-h shift with 4 updates it is 2 hours.","Что такое режим «Смена»?":"What is the “Shift” mode?","Тариф дешевле: бот пишет в группы и присылает сигналы только в ваше рабочее время (смена 8, 10 или 12 ч, дни выбираете вы). Вне смены он только анализирует, а в начале смены присылает сводку. Тревоги можно получать всегда. Например: /plan lite shift":"A cheaper plan: the bot posts in groups and sends alerts only during your working time (an 8, 10 or 12-h shift, you pick the days). Outside the shift it only analyses and sends a summary when the shift starts. Alarms can still come at any time. Example: /plan lite shift","Как настроить смену и выходные?":"How do I set the shift and days off?","«Настройки» → «Рабочее время»: начало смены, обычная длина и каждый день недели (выходной, 8, 10 или 12 ч). Или командой, например: /worktime 16:00 8, /worktime sat 12, /worktime sun off":"“Settings” → “Working time”: shift start, usual length and every weekday (off, 8, 10 or 12 h). Or with a command, for example: /worktime 16:00 8, /worktime sat 12, /worktime sun off","Как выбрать часовой пояс?":"How do I pick my time zone?","Почему нельзя ставить апдейты чаще?":"Why can't I set updates more often?","Рабочее время":"Working time","круглосуточно":"around the clock","Выходные":"Days off","Изменить рабочее время":"Change working time","Пн":"Mon","Вт":"Tue","Ср":"Wed","Чт":"Thu","Пт":"Fri","Сб":"Sat","Вс":"Sun","Все функции и агенты на любом тарифе. Отличаются число водителей, апдейтов в день и режим.":"Every plan has all features and agents. Plans differ by drivers, updates a day and mode.","дешевле":"cheaper","в любое время":"any time","Бот пишет в группы в любое время рабочих дней. Выходные дни можно отметить.":"The bot posts in groups at any time on working days. You can mark days off.","Смена → 24/7":"Shift → 24/7","Считается тарифом больше: включается сразу.":"Counts as a bigger plan: starts now.","24/7 → Смена":"24/7 → Shift","Со следующего периода.":"From the next period.","Ваш часовой пояс":"Your time zone","24/7: /plan start full. Свой тариф: /plan. Какие группы в работе: /drivers":"24/7: /plan start full. Your plan: /plan. Which groups are working: /drivers","Когда бот пишет в группы и присылает сигналы":"When the bot posts in groups and sends alerts","Сменить":"Change","Бот пишет в любое время рабочих дней. В выходные он только анализирует.":"The bot posts at any time on working days. On days off it only analyses.","Дни недели":"Weekdays","Работаем":"Working","Сейчас рабочее время":"Working time now","Круглосуточно в рабочие дни":"Around the clock on working days","Длинный день: /worktime sat 12. Выходной: /worktime sun off. Часовой пояс: /tz us-c":"Long day: /worktime sat 12. Day off: /worktime sun off. Time zone: /tz us-c","По нему бот считает апдейты, смену и даты":"The bot uses it for updates, the shift and dates","США":"USA","Россия":"Russia","Другие страны":"Other countries","Пунктир: время только в длинные дни":"Dashed: only on long days","Бот пишет в группы только в ваше рабочее время: смена 8, 10 или 12 ч, дни выбираете вы. Вне смены бот только анализирует, а в начале смены присылает сводку.":"The bot posts in groups only during your working time: an 8, 10 or 12-h shift, you pick the days. Outside the shift it only analyses and sends a summary when the shift starts.","Дешевле · цена уточняется":"Cheaper · price to be set","Бот пишет в группы и присылает сигналы только в смену. Вне смены он только анализирует, а в начале смены присылает сводку: что было, пока вас не было.":"The bot posts in groups and sends alerts only during the shift. Outside it, it only analyses and when the shift starts sends a summary of what happened while you were away.","Начало смены":"Shift start","Обычная длина смены":"Usual shift length","Вых":"Off","Например, обычно 8 ч, а в дни, когда напарник отдыхает, 12 ч.":"For example, usually 8 h, and 12 h on the days your partner rests.","Сейчас не рабочее время":"Not working time now","Тревоги вне смены":"Alarms outside the shift","Авария, поломка, полиция: присылать сразу":"Accident, breakdown, police: send right away","Режим":"Mode","Часовой пояс":"Time zone","Время":"Time","нет":"none","Смена":"Shift",
"Автоапдейты по расписанию":"Scheduled auto updates","Не чаще раза в 2 часа, время выбираете вы":"Not more often than every 2 hours, you pick the times","От 3 раз в сутки, не чаще одного раза в 2 часа. Максимум зависит от тарифа: Лайт 4, Старт 6, Про 8, Макс 12. Время каждого апдейта выбираете вы.":"At least 3 a day, not more often than every 2 hours. The maximum depends on the plan: Lite 4, Start 6, Pro 8, Max 12. You pick the time of each update.","Тарифы отличаются числом водителей и апдейтов в день, все функции есть на любом тарифе: Лайт до 10, Старт до 20, Про до 40, Макс до 80 водителей. Апдейтов в день: Лайт 4, Старт 6, Про 8, Макс 12. Цены ещё не утверждены.":"Plans differ by number of drivers and updates a day, every plan has all features: Lite up to 10, Start up to 20, Pro up to 40, Max up to 80 drivers. Updates a day: Lite 4, Start 6, Pro 8, Max 12. Prices are not approved yet.","Все функции и агенты на любом тарифе. Отличаются число водителей и апдейтов в день.":"Every plan has all features and agents. Plans differ by number of drivers and updates a day.","Не меньше 2 часов между апдейтами":"At least 2 hours between updates","От 3 до 12 раз в сутки, не чаще чем раз в 2 часа.":"3 to 12 times a day, not more often than every 2 hours.","От 3 раз в сутки, максимум по тарифу: в окне или командой /times":"At least 3 a day, the maximum by plan: in the window or with /times","Больше 12 апдейтов в день нельзя. Уберите лишнее время.":"No more than 12 updates a day. Remove the extra times.",
"Включено":"Turned on","Изменить агентов":"Change agents","Автоответ":"Auto-reply","предлагать":"suggest","авто":"auto","выключен":"off","Агенты проверяют группы 24/7 и пишут только вам: водитель ждёт ответа, молчит, тревога, стоянка, нет GPS.":"Agents check groups 24/7 and write only to you: driver waiting, silent, alarm, long stop, no GPS.",
"Бот работает с группами в тарифе 24/7. Писать в них будет только в выбранное время апдейтов.":"The bot works with the groups in your plan 24/7. It posts to them only at the chosen update times.","Вы владелец: бот работает со всеми группами UNIT, лимита нет.":"You are the owner: the bot works with every UNIT group, no limit.","Пример данных. Ваши группы появятся здесь, когда вы добавите бота в группы водителей.":"Sample data. Your groups appear here once you add the bot to driver groups.","В работе: апдейты и агенты":"Working: updates and agents","На паузе: только сохраняет сообщения":"Paused: only saves messages","Не хватает мест: «Сменить тариф» или /plan start":"Not enough room: “Change plan” or /plan start","Если в тарифе есть место, группа сразу в работе. Если нет, она встанет на паузу, и бот предложит, что сделать.":"If the plan has room, the group starts working right away. If not, it is paused and the bot offers what to do.","Владелец · без лимита":"Owner · no limit",
"Тарифы отличаются только числом водителей, все функции есть на любом тарифе: Лайт до 10, Старт до 20, Про до 40, Макс до 80 водителей. Цены ещё не утверждены.":"Plans differ only by number of drivers, every plan has all features: Lite up to 10, Start up to 20, Pro up to 40, Max up to 80 drivers. Prices are not approved yet.","«Настройки» → «Сменить тариф» или командой в чате, например: /plan start. Тариф больше включается сразу, тариф меньше со следующего периода (30 дней), до этого его можно отменить. Функции не меняются, меняется только лимит водителей.":"“Settings” → “Change plan”, or with a command in the chat, for example: /plan start. A bigger plan starts now, a smaller one from the next period (30 days) and can be cancelled until then. Features stay the same, only the driver limit changes.","Лишняя группа встаёт на паузу: бот сохраняет её сообщения, но апдейтов и проверок по ней нет. Бот сразу предложит три варианта: заменить другую группу, перейти на тариф больше или выйти из группы. Какие группы в работе, можно поменять командой /drivers.":"An extra group is paused: the bot saves its messages, but there are no updates or checks for it. The bot offers three choices right away: swap it for another group, move to a bigger plan, or leave the group. Change which groups are working with /drivers.","На борде водителей больше, чем в тарифе?":"The board has more drivers than my plan?","Бот следит только за водителями, чьи группы в работе, и раз в день пишет, кого не видит и какой тариф нужен для всех. Чтение борда в разработке.":"The bot follows only drivers whose groups are working, and once a day tells you who is left out and which plan covers everyone. Board reading is in development.","Что будет, если не оплатить?":"What happens if I do not pay?","Бот напомнит за 3 дня и за 1 день до конца периода. После конца ещё 3 дня всё работает, потом апдейты и агенты останавливаются, окно только для просмотра. Данные не удаляются. Оплата появится позже.":"The bot reminds you 3 days and 1 day before the period ends. After the end everything works 3 more days, then updates and agents stop and the window is view-only. Data is kept. Payment comes later.","Что такое агенты?":"What are agents?","Это проверки, которые работают 24/7 и пишут только вам: водитель ждёт ответа, водитель молчит, тревожные слова, долгая стоянка, нет GPS, опоздание. Изменить: «Настройки» → «Агенты и автоответ» или команда /settings.":"Checks that run 24/7 and write only to you: driver waiting, driver silent, alarm words, long stop, no GPS, late. Change them: “Settings” → “Agents and auto-reply” or the /settings command.","Бот будет сам отвечать водителям?":"Will the bot answer drivers by itself?","Только если вы включите автоответ «Авто». По умолчанию бот предлагает ответ, а отправляете вы. Тревожные сообщения (авария, поломка, полиция) бот сам не отвечает никогда. Например: /agents autoreply suggest":"Only if you turn auto-reply “Auto” on. By default the bot suggests a reply and you send it. The bot never answers alarm messages (accident, breakdown, police) by itself. Example: /agents autoreply suggest","Агенты и автоответ":"Agents and auto-reply","Агенты":"Agents","Агенты 24/7":"Agents 24/7","Ждёт ответа, молчит, тревога, стоянка, автоответ":"Waiting, silent, alarm, long stop, auto-reply","Все функции и агенты на любом тарифе. Отличается только число водителей.":"Every plan has all features and agents. Only the number of drivers differs.","Перейти сейчас":"Switch now","Со след. периода":"From next period","Как меняется тариф":"How plan changes work","Тариф больше":"Bigger plan","Включается сразу. Пока оплата не подключена, без доплаты.":"Starts now. While payment is not connected, no extra charge.","Включается сразу. Доплата только за оставшиеся дни периода.":"Starts now. You pay only for the days left in the period.","Тариф меньше":"Smaller plan","Со следующего периода. До этого можно отменить.":"From the next period. You can cancel until then.","Период":"Period","30 дней. Напоминание за 3 дня и за 1 день до конца.":"30 days. Reminders 3 days and 1 day before the end.","Не хватает мест":"No room left","Новая группа встаёт на паузу. Бот предложит заменить другую группу, перейти на тариф больше или выйти из группы.":"A new group is paused. The bot offers to swap another group, move to a bigger plan or leave the group.","Борд больше тарифа":"Board bigger than the plan","Бот следит только за водителями, чьи группы в работе, и раз в день пишет, кто не вошёл.":"The bot follows only drivers whose groups are working and tells you once a day who is left out.","Все агенты и автоответ":"All agents and auto-reply","Свой тариф: /plan. Какие группы в работе: /drivers":"Your plan: /plan. Which groups are working: /drivers","Группы в тарифе":"Groups in the plan","Проверяют группы 24/7 и пишут только вам":"They check groups 24/7 and write only to you","Водитель ждёт ответа":"Driver waiting","Сигнал, если команда не ответила водителю":"Alert when the team has not answered a driver","Через сколько минут":"After how many minutes","Водитель молчит":"Driver silent","Команда задала вопрос, а водитель не отвечает":"The team asked a question and the driver does not answer","Тревожные слова":"Alarm words","Авария, поломка, полиция, отказ, пломба и другие, на 4 языках":"Accident, breakdown, police, rejected, seal and more, in 4 languages","Долгая стоянка":"Long stop","Трак стоит, а водитель не писал о перерыве или отдыхе":"The truck stands and the driver said nothing about a break or rest","Для вас: после подключения вашего ELD к серверу (в плане)":"For you: after your ELD is connected on the server (planned)","Нет GPS":"No GPS","Последние данные GPS старше 60 минут":"The latest GPS data is older than 60 minutes","Опоздание":"Late","По борду и честному расчёту ETA":"By the board and the honest ETA math","Ждёт подключения борда":"Waits for the board","Автоответ водителю":"Auto-reply to drivers","Выключен":"Off","Только сигнал вам":"Only an alert to you","Предлагать ответ":"Suggest a reply","Бот пишет черновик ответа, вы нажимаете «Отправить», «Изменить» или «Пропустить»":"The bot writes a draft reply, you tap “Send”, “Edit” or “Skip”","В группы водителей бот пишет только после вашего «Отправить» или в режиме «Авто». Сообщения водителей для бота только данные, команды из них он не выполняет.":"The bot posts in driver groups only after your “Send” or in “Auto” mode. Driver messages are only data for the bot, it does not follow commands in them.","Автоответ: /agents autoreply suggest. Выключить агента: /agents risk off":"Auto-reply: /agents autoreply suggest. Turn an agent off: /agents risk off","По группам на паузе нет апдейтов и проверок. Бот сохраняет их сообщения.":"Paused groups get no updates or checks. The bot saves their messages.",

ть тариф?":"How do I change my plan?","«Настройки» → «Сменить тариф» или командой в чате, например: /plan pro. Функции не меняются, меняется только лимит водителей. Апдейты и окно сразу подстраиваются.":"“Settings” → “Change plan”, or with a command in the chat, for example: /plan pro. Features stay the same, only the driver limit changes. Updates and the window adjust right away.","Что если групп больше, чем в тарифе?":"What if I have more groups than my plan covers?","Бот читает все группы, но апдейты отправляет только по первым группам в пределах тарифа (по дате добавления). Когда добавляете лишнюю группу, бот сразу пишет об этом. Например, на Лайт апдейты идут по 5 группам.":"The bot reads every group but sends updates only to the first groups within the plan (by the date they were added). When you add an extra group, the bot tells you right away. For example, on Lite updates go to 5 groups.",

'Что такое Modenzo AI?':'What is Modenzo AI?','Помощник диспетчера в Telegram. Он читает чаты водителей, смотрит GPS и часы работы, считает честный ETA и заранее предупреждает, какой груз опаздывает и на сколько. Апдейты отправляет только с вашего согласия.':'A dispatcher assistant in Telegram. It reads driver chats, checks GPS and driver hours, calculates an honest ETA and warns you early which load is running late and by how much. It sends updates only with your approval.',
'Как начать работу?':'How do I get started?','Нажмите /start и ответьте на 7 коротких вопросов: борд, грузы, ELD, коллеги, часовой пояс, смена, число водителей. Потом добавьте бота в группы водителей. В начале смены нажмите «Запустить смену».':'Tap /start and answer 7 short questions: board, freight, ELD, teammates, time zone, shift, number of drivers. Then add the bot to driver groups. At the start of a shift tap “Start shift”.',
'Как добавить бота в группу водителя?':'How do I add the bot to a driver group?','Откройте группу в Telegram и добавьте бота как участника. Бот сам проверит, видит ли он сообщения. Если нет, подскажет: обычно нужно сделать его администратором или добавить заново.':'Open the group in Telegram and add the bot as a member. The bot checks whether it can see messages. If not, it tells you what to do: usually make it an admin or add it again.',
'Как подключить ELD?':'How do I connect my ELD?','В /start или в Настройках, раздел «Подключения». Вставьте API-ключ ELD вашей компании, бот проверит его. Проверка ключа работает для Samsara, Motive и Geotab. GPS пока берётся только из Samsara.':'In /start or in Settings, “Connections”. Paste your company’s ELD API key and the bot checks it. The key check works for Samsara, Motive and Geotab. GPS currently comes from Samsara only.',
'Нужно ли водителям что-то устанавливать?':'Do drivers need to install anything?','Нет. Водители пишут в свои группы как обычно. Бот работает внутри этих групп.':'No. Drivers write in their groups as usual. The bot works inside those groups.',
'Бот будет сам писать водителям?':'Will the bot message drivers by itself?','Нет. Пока вы не запустили смену, бот только читает и анализирует. В группы он пишет только после запуска смены и только в выбранном вами режиме.':'No. Until you start a shift, the bot only reads and analyses. It posts to groups only after a shift starts and only in the mode you chose.',
'Как запустить смену?':'How do I start a shift?','На главной нажмите «Управлять сменой». Выберите длительность (6, 7, 8 или 10 часов), как часто слать апдейты и режим. Потом нажмите «Запустить смену».':'On Home tap “Manage shift”. Pick the length (6, 7, 8 or 10 hours), how often to send updates and the mode. Then tap “Start shift”.',
'Чем «Сначала показать мне» отличается от «Авто»?':'How is “Show me first” different from “Auto”?','В режиме «Сначала показать мне» бот готовит апдейт, а вы нажимаете «Отправить», «Изменить» или «Пропустить». В режиме «Авто» бот отправляет апдейты сам по расписанию.':'In “Show me first” the bot drafts the update and you tap “Send”, “Edit” or “Skip”. In “Auto” the bot sends updates on schedule by itself.',
'Как часто приходят автоапдейты?':'How often do auto updates go out?','От 3 до 6 раз в сутки, не чаще одного раза в 4 часа. Время каждого апдейта выбираете вы.':'3 to 6 times a day, not more often than every 4 hours. You pick the time of each update.',
'Как остановить бота?':'How do I stop the bot?','Нажмите «Остановить смену» на экране смены или отправьте команду /stop. Бот сразу перестанет писать в группы.':'Tap “Stop shift” on the shift screen or send /stop. The bot stops posting to groups right away.',
'Работает ли бот вне моей смены?':'Does the bot work outside my shift?','Да, он читает и анализирует 24/7, но в группы вне смены не пишет. Это подходит для любой смены, не только ночной.':'Yes, it reads and analyses 24/7 but does not post to groups outside a shift. It fits any shift, not only nights.',
'Как бот считает ETA?':'How does the bot calculate ETA?','Считает код, а не ИИ: где грузовик по GPS, маршрут с пробками, сколько часов осталось у водителя, погода по пути и часовой пояс стопа. ИИ только объясняет результат словами.':'Code calculates it, not AI: truck position from GPS, route with traffic, hours the driver has left, weather on the way and the stop time zone. AI only explains the result in words.',
'Что значат On time, Tight и Probably late?':'What do On time, Tight and Probably late mean?','On time: запас больше 30 минут. Tight: запас от 0 до 30 минут. Probably late: опоздание, бот пишет на сколько минут и почему.':'On time: more than 30 minutes of buffer. Tight: 0 to 30 minutes. Probably late: the bot says by how many minutes and why.',
'Почему время указано не по-моему?':'Why is the time not in my time zone?','Срок доставки сравнивается во времени самого стопа, потому что так его видит склад и брокер.':'The appointment is compared in the stop’s own time, because that is how the warehouse and broker see it.',
'Что если в грузе несколько стопов?':'What if a load has several stops?','Бот считает до стопа, к которому водитель едет сейчас, и дальше по цепочке. Если опоздание на 3-м стопе, сразу видно, что будет на 4-м.':'The bot calculates to the stop the driver is heading to now and on down the chain. If stop 3 is late, you see right away what happens at stop 4.',
'Насколько точен ETA?':'How accurate is the ETA?','Идеально точного прогноза не бывает: пробки и водители меняются. Бот будет сравнивать прогноз с реальным прибытием и показывать свою точность за последние 30 прогнозов (в плане).':'No forecast is perfect: traffic and drivers change. The bot will compare its forecast with the real arrival and show its accuracy over the last 30 forecasts (planned).',
'Учитываются ли ограничения для грузовиков?':'Are truck restrictions taken into account?','Пока нет. Сервис маршрутов не знает низких мостов и запретных для грузовиков дорог. Это стоит помнить на сложных маршрутах.':'Not yet. The routing service does not know low bridges or roads closed to trucks. Keep that in mind on tricky routes.',
'Что если грузовик стоит?':'What if the truck is stopped?','Бот не гадает, сколько он простоит. Он считает, как будто водитель выедет сейчас, и пишет это в пояснении.':'The bot does not guess how long it will stay. It calculates as if the driver leaves now and says so in the explanation.',
'Какие языки поддерживаются?':'Which languages are supported?','Окно и бот: русский, английский и узбекский. Водителей бот понимает и на турецком и отвечает им на их языке.':'Russian and English work now. Turkish and Uzbek are coming later.',
'О чём можно спрашивать бота?':'What can I ask the bot?','Только о логистике: грузы, стопы, часы водителя, Amazon Relay, Street и похожее. Другие темы бот вежливо отклонит.':'Only logistics: loads, stops, driver hours, Amazon Relay, Street and similar. The bot politely declines other topics.',
'Может ли бот переводить для водителя?':'Can the bot translate for the driver?','Да, командой /tr: русский текст превращается в короткое английское сообщение водителю, английский переводится на русский. Например: /tr пришли фото BOL':'In development: you write in Russian, Uzbek or Turkish and the driver gets English.',
'Кто видит мои ключи и данные?':'Who can see my keys and data?','Ключи хранятся только на сервере и нигде не показываются. Раздельное хранение данных каждого клиента и шифрование ключей появятся до того, как бот начнут использовать другие компании.':'Keys are stored only on the server and are never shown. Separate storage for each client and key encryption will be in place before other companies use the bot.',
'Может ли кто-то управлять ботом через сообщение в чате?':'Can someone control the bot with a chat message?','Нет. Сообщения, фото и текст в них для бота только данные. Команды вроде «забудь правила» или «пришли ключ» он не выполняет.':'No. Messages, photos and the text in them are only data to the bot. It does not follow commands like “forget your rules” or “send me the key”.',
'Бот читает Amazon Relay?':'Does the bot read Amazon Relay?','Это последний этап. Чтение будет через расширение Chrome и только на чтение: бот ничего не нажимает и не меняет в Relay.':'That is the last stage. Reading will go through a Chrome extension, read-only: the bot clicks and changes nothing in Relay.',
'Сколько стоит?':'How much does it cost?','Тарифы отличаются только числом водителей, все функции есть на любом тарифе. План цен: от $9 в месяц до 10 водителей. Цены окончательно не утверждены.':'Plans differ only by number of drivers, every plan has all features. Planned pricing: from $9 a month for up to 10 drivers. Prices are not final.',
'Есть ли пробный период?':'Is there a trial?','Планируется пробная неделя: если не подойдёт, вернём деньги за вычетом использованных дней. Точная формула будет в оферте.':'A trial week is planned: if it does not fit, you get your money back minus the days used. The exact formula will be in the terms.',
'Как оплатить?':'How do I pay?','Оплата через Click, Payme и другие способы появится позже, после запуска сервера.':'Payment via Click, Payme and other methods will come later, after the server launch.',

"Может ли кто-то управлять ботом через сообщение в чате?":"Kimdir chatdagi xabar orqali botni boshqara oladimi?",
"Бот читает Amazon Relay?":"Bot Amazon Relay'ni o'qiydimi?",

"На борде водителей больше, чем в тарифе?":"Doskada haydovchilar tarifdagidan ko'pmi?",
"Что будет, если не оплатить?":"To'lamasam nima bo'ladi?",
"Почему некоторые кнопки с замком?":"Nega ba'zi tugmalarda qulf bor?",

"Бот будет сам отвечать водителям?":"Bot haydovchilarga o'zi javob beradimi?",

"Напишите владельцу командой /support":"Egasiga /support buyrug'i bilan yozing",
"Написать":"Yozish",
"Нажмите /start и ответьте на 7 коротких вопросов: борд, грузы, ELD, коллеги, часовой пояс, смена, число водителей. Потом добавьте бота в группы водителей и выберите время апдейтов в «Расписании».":"/start ni bosing va 7 ta qisqa savolga javob bering: doska, yuklar, ELD, hamkasblar, vaqt mintaqasi, smena, haydovchilar soni. Keyin botni haydovchilar guruhlariga qo'shing va «Jadval»da apdeyt vaqtini tanlang.",
"Откройте группу в Telegram и добавьте бота как участника. Бот сам проверит, видит ли он сообщения. Если нет, подскажет: обычно нужно сделать его администратором или добавить заново.":"Telegramda guruhni oching va botni a'zo sifatida qo'shing. Bot xabarlarni ko'ra olishini o'zi tekshiradi. Ko'ra olmasa, maslahat beradi: odatda uni administrator qilish yoki qaytadan qo'shish kerak.",
"В /start или в Настройках, раздел «Подключения». Вставьте API-ключ ELD вашей компании, бот проверит его. Проверка ключа работает для Samsara, Motive и Geotab. GPS пока берётся только из Samsara.":"/start'da yoki /eld buyrug'i bilan. Kompaniyangiz ELD API kalitini yuboring, bot uni tekshiradi. Kalit tekshiruvi Samsara, Motive va Geotab uchun ishlaydi. GPS hozircha faqat Samsara'dan olinadi.",
"Нет. Водители пишут в свои группы как обычно. Бот работает внутри этих групп.":"Yo'q. Haydovchilar o'z guruhlariga odatdagidek yozadi. Bot shu guruhlar ichida ishlaydi.",
"Только в выбранное вами время и в выбранном режиме. В режиме «Сначала показать мне» каждый апдейт вы отправляете сами кнопкой.":"Faqat siz tanlagan vaqtda va tanlagan rejimda. «Avval menga ko'rsatish» rejimida har bir apdeytni o'zingiz tugma bilan yuborasiz.",
"Откройте окно → «Расписание», отметьте время (от 3 раз в сутки, максимум по тарифу, не чаще раза в 2 часа), выберите режим и нажмите «Сохранить». Или командой в чате, например: /times 08:00 14:00 20:00":"Oynani oching → «Jadval», vaqtni belgilang (kuniga 3 martadan, maksimum tarif bo'yicha, 2 soatda bir martadan ko'p emas), rejimni tanlang va «Saqlash»ni bosing. Yoki chatda buyruq bilan, masalan: /times 08:00 14:00 20:00",
"В режиме «Сначала показать мне» бот готовит апдейт, а вы нажимаете «Отправить», «Изменить» или «Пропустить». В режиме «Авто» бот отправляет апдейты сам по расписанию.":"«Avval menga ko'rsatish» rejimida bot apdeyt tayyorlaydi, siz esa «Yuborish», «O'zgartirish» yoki «O'tkazib yuborish»ni bosasiz. «Avto» rejimida bot apdeytlarni jadval bo'yicha o'zi yuboradi.",
"От 3 раз в сутки, не чаще одного раза в 2 часа. Максимум зависит от тарифа: Лайт 4, Старт 6, Про 8, Макс 12. Время каждого апдейта выбираете вы.":"Kuniga 3 martadan, 2 soatda bir martadan ko'p emas. Maksimum tarifga bog'liq: Lite 4, Start 6, Pro 8, Max 12. Har bir apdeyt vaqtini o'zingiz tanlaysiz.",
"Тариф дешевле: бот пишет в группы и присылает сигналы только в ваше рабочее время (смена 8, 10 или 12 ч, дни выбираете вы). Вне смены он только анализирует, а в начале смены присылает сводку. Тревоги можно получать всегда. Например: /plan lite shift":"Arzonroq tarif: bot guruhlarga yozadi va signallarni faqat ish vaqtingizda yuboradi (smena 8, 10 yoki 12 soat, kunlarni o'zingiz tanlaysiz). Smenadan tashqarida faqat tahlil qiladi, smena boshida esa xulosa yuboradi. Xavotirlarni har doim olish mumkin. Masalan: /plan lite shift",
"«Настройки» → «Рабочее время»: начало смены, обычная длина и каждый день недели (выходной, 8, 10 или 12 ч). Или командой, например: /worktime 16:00 8, /worktime sat 12, /worktime sun off":"«Sozlamalar» → «Ish vaqti»: smena boshlanishi, odatiy davomiyligi va har bir hafta kuni (dam olish, 8, 10 yoki 12 soat). Yoki buyruq bilan, masalan: /worktime 16:00 8, /worktime sat 12, /worktime sun off",
"Да, в любой момент: «Настройки» → «Рабочее время» → календарь «Разовые выходные». Нажмите на нужные даты и «Сохранить даты». Или командой, например: /off 25.11-27.11 или /off 3. В эти дни бот не пишет в группы и не шлёт сигналы, а когда вы вернётесь, пришлёт сводку.":"Ha, istalgan vaqtda: «Sozlamalar» → «Ish vaqti» → «Bir martalik dam olish kunlari» kalendari. Kerakli sanalarni bosing va «Sanalarni saqlash»ni bosing. Yoki buyruq bilan, masalan: /off 25.11-27.11 yoki /off 3. Bu kunlarda bot guruhlarga yozmaydi va signal yubormaydi, qaytganingizda esa xulosa yuboradi.",
"«Настройки» → «Рабочее время» → «Часовой пояс»: США (EST, CST, MST, PST и другие), все зоны России, Узбекистан и соседние страны, Турция, Европа. Или командой, например: /tz us-e":"«Sozlamalar» → «Ish vaqti» → «Vaqt mintaqasi»: AQSh (EST, CST, MST, PST va boshqalar), Rossiyaning barcha mintaqalari, O'zbekiston va qo'shni davlatlar, Turkiya, Yevropa. Yoki buyruq bilan, masalan: /tz us-e",
"Перерыв считает сам бот: рабочее окно делится на число апдейтов в тарифе, от 2 до 4 часов. Для 24/7 это обычно 4 часа, для смены 8 ч на 4 апдейта — 2 часа.":"Tanaffusni bot o'zi hisoblaydi: ish oynasi tarifdagi apdeytlar soniga bo'linadi, 2 dan 4 soatgacha. 24/7 uchun odatda 4 soat, 8 soatlik smenada 4 ta apdeyt uchun 2 soat.",
"В «Расписании» выключите переключатель и нажмите «Сохранить» или отправьте команду /updates off. Включить обратно: /updates on.":"«Jadval»da o'tkazgichni o'chiring va «Saqlash»ni bosing yoki /updates off buyrug'ini yuboring. Qayta yoqish: /updates on.",
"Нет, 24/7, для любой смены. Апдейты уходят в выбранное время, а читает и анализирует бот круглосуточно.":"Yo'q, 24/7, har qanday smena uchun. Apdeytlar tanlangan vaqtda ketadi, bot esa kecha-kunduz o'qiydi va tahlil qiladi.",
"Считает код, а не ИИ: где грузовик по GPS, маршрут с пробками, сколько часов осталось у водителя, погода по пути и часовой пояс стопа. ИИ только объясняет результат словами.":"Sun'iy intellekt emas, kod hisoblaydi: GPS bo'yicha yuk mashinasi qayerda, tirbandlikli yo'nalish, haydovchida necha soat qolgan, yo'ldagi ob-havo va stop vaqt mintaqasi. Sun'iy intellekt faqat natijani so'z bilan tushuntiradi.",
"On time: запас больше 30 минут. Tight: запас от 0 до 30 минут. Probably late: опоздание, бот пишет на сколько минут и почему.":"On time: zaxira 30 daqiqadan ko'p. Tight: zaxira 0 dan 30 daqiqagacha. Probably late: kechikish, bot necha daqiqa va nima uchun ekanini yozadi.",
"Срок доставки сравнивается во времени самого стопа, потому что так его видит склад и брокер.":"Yetkazish muddati stopning o'z vaqti bo'yicha solishtiriladi, chunki ombor va broker uni shunday ko'radi.",
"Бот считает до стопа, к которому водитель едет сейчас, и дальше по цепочке. Если опоздание на 3-м стопе, сразу видно, что будет на 4-м.":"Bot haydovchi hozir ketayotgan stopgacha va keyin zanjir bo'yicha hisoblaydi. 3-stopda kechikish bo'lsa, 4-stopda nima bo'lishi darhol ko'rinadi.",
"Идеально точного прогноза не бывает: пробки и водители меняются. Бот будет сравнивать прогноз с реальным прибытием и показывать свою точность за последние 30 прогнозов (в плане).":"Mutlaqo aniq prognoz bo'lmaydi: tirbandlik va haydovchilar o'zgaradi. Bot prognozni haqiqiy yetib kelish bilan solishtiradi va oxirgi 30 ta prognoz aniqligini ko'rsatadi (rejada).",
"Пока нет. Сервис маршрутов не знает низких мостов и запретных для грузовиков дорог. Это стоит помнить на сложных маршрутах.":"Hozircha yo'q. Yo'nalish xizmati past ko'priklar va yuk mashinalari uchun taqiqlangan yo'llarni bilmaydi. Murakkab yo'nalishlarda buni yodda tuting.",
"Бот не гадает, сколько он простоит. Он считает, как будто водитель выедет сейчас, и пишет это в пояснении.":"Bot qancha turishini taxmin qilmaydi. U haydovchi hozir yo'lga chiqadi deb hisoblaydi va buni izohda yozadi.",
"Русский и английский уже работают. Турецкий и узбекский появятся позже.":"Oyna va bot: rus, ingliz va o'zbek tillarida. Haydovchilarni bot turk tilida ham tushunadi va ularga o'z tilida javob beradi.",
"Только о логистике: грузы, стопы, часы водителя, Amazon Relay, Street и похожее. Другие темы бот вежливо отклонит.":"Faqat logistika haqida: yuklar, stoplar, haydovchi soatlari, Amazon Relay, Street va shunga o'xshashlar. Boshqa mavzularni bot xushmuomalalik bilan rad etadi.",
"Это в разработке: вы пишете на русском, узбекском или турецком, водитель получает текст на английском.":"Ha, /tr buyrug'i bilan: ruscha matn haydovchi uchun qisqa inglizcha xabarga aylanadi, inglizcha esa ruschaga tarjima qilinadi. Masalan: /tr пришли фото BOL",
"Ключи хранятся только на сервере и нигде не показываются. Раздельное хранение данных каждого клиента и шифрование ключей появятся до того, как бот начнут использовать другие компании.":"Kalitlar faqat serverda saqlanadi va hech qayerda ko'rsatilmaydi. Har bir mijoz ma'lumotlarini alohida saqlash va kalitlarni shifrlash bot boshqa kompaniyalar tomonidan ishlatila boshlanishidan oldin paydo bo'ladi.",
"Нет. Сообщения, фото и текст в них для бота только данные. Команды вроде «забудь правила» или «пришли ключ» он не выполняет.":"Yo'q. Xabarlar, rasmlar va ulardagi matn bot uchun faqat ma'lumot. «Qoidalarni unut» yoki «kalitni yubor» kabi buyruqlarni u bajarmaydi.",
"Это последний этап. Чтение будет через расширение Chrome и только на чтение: бот ничего не нажимает и не меняет в Relay.":"Bu oxirgi bosqich. O'qish Chrome kengaytmasi orqali va faqat o'qish uchun bo'ladi: bot Relay'da hech narsani bosmaydi va o'zgartirmaydi.",
"Тарифы отличаются числом водителей и апдейтов в день, все функции есть на любом тарифе: Лайт до 10, Старт до 20, Про до 40, Макс до 80 водителей. Апдейтов в день: Лайт 4, Старт 6, Про 8, Макс 12. Цены ещё не утверждены.":"Tariflar haydovchilar va kunlik apdeytlar soni bilan farq qiladi, barcha funksiyalar har qanday tarifda bor: Lite 10 tagacha, Start 20 tagacha, Pro 40 tagacha, Max 80 tagacha haydovchi. Kunlik apdeytlar: Lite 4, Start 6, Pro 8, Max 12. Narxlar hali tasdiqlanmagan.",
"«Настройки» → «Сменить тариф» или командой в чате, например: /plan start. Тариф больше включается сразу, тариф меньше со следующего периода (30 дней), до этого его можно отменить. Функции не меняются, меняется только лимит водителей.":"«Sozlamalar» → «Tarifni o'zgartirish» yoki chatda buyruq bilan, masalan: /plan start. Kattaroq tarif darhol yoqiladi, kichikroq tarif keyingi davrdan (30 kun), ungacha bekor qilish mumkin. Funksiyalar o'zgarmaydi, faqat haydovchilar limiti o'zgaradi.",
"Лишняя группа встаёт на паузу: бот сохраняет её сообщения, но апдейтов и проверок по ней нет. Бот сразу предложит три варианта: заменить другую группу, перейти на тариф больше или выйти из группы. Какие группы в работе, можно поменять командой /drivers.":"Ortiqcha guruh pauzaga qo'yiladi: bot uning xabarlarini saqlaydi, lekin u bo'yicha apdeyt va tekshiruv yo'q. Bot darhol uch variant taklif qiladi: boshqa guruhni almashtirish, kattaroq tarifga o'tish yoki guruhdan chiqish. Qaysi guruhlar ishda ekanini /drivers buyrug'i bilan o'zgartirish mumkin.",
"Бот следит только за водителями, чьи группы в работе, и раз в день пишет, кого не видит и какой тариф нужен для всех. Чтение борда в разработке.":"Bot faqat guruhlari ishda bo'lgan haydovchilarni kuzatadi va kuniga bir marta kimni ko'rmayotganini va hammasi uchun qaysi tarif kerakligini yozadi. Doskani o'qish ishlab chiqilmoqda.",
"Бот напомнит за 3 дня и за 1 день до конца периода. После конца ещё 3 дня всё работает, потом апдейты и агенты останавливаются, окно только для просмотра. Данные не удаляются. Оплата появится позже.":"Bot davr tugashidan 3 kun va 1 kun oldin eslatadi. Tugagandan keyin yana 3 kun hammasi ishlaydi, keyin apdeytlar va agentlar to'xtaydi, oyna faqat ko'rish uchun qoladi. Ma'lumotlar o'chirilmaydi. To'lov keyinroq paydo bo'ladi.",
"Пока активация не закончена, часть функций закрыта, чтобы ничего не сломать. Шаги: опрос, тариф, ELD, хотя бы одна группа водителя. Нажмите на кнопку с замком: окно подскажет, какой шаг остался, и даст кнопку, чтобы его сделать. Например, ELD подключается командой /eld":"Faollashtirish tugamaguncha, hech narsa buzilmasligi uchun funksiyalarning bir qismi yopiq. Qadamlar: so'rovnoma, tarif, ELD, kamida bitta haydovchi guruhi. Qulfli tugmani bosing: oyna qaysi qadam qolganini aytadi va uni bajarish uchun tugma beradi. Masalan, ELD /eld buyrug'i bilan ulanadi",
"Это проверки, которые работают 24/7 и пишут только вам: водитель ждёт ответа, водитель молчит, тревожные слова, долгая стоянка, нет GPS, опоздание. Изменить: «Настройки» → «Агенты и автоответ» или команда /settings.":"Bu 24/7 ishlaydigan va faqat sizga yozadigan tekshiruvlar: haydovchi javob kutmoqda, haydovchi jim, xavotirli so'zlar, uzoq turish, GPS yo'q, kechikish. O'zgartirish: «Sozlamalar» → «Agentlar va avtojavob» yoki /settings buyrug'i.",
"Только если вы включите автоответ «Авто». По умолчанию бот предлагает ответ, а отправляете вы. Тревожные сообщения (авария, поломка, полиция) бот сам не отвечает никогда. Например: /agents autoreply suggest":"Faqat «Avto» avtojavobini yoqsangiz. Odatda bot javob taklif qiladi, siz esa yuborasiz. Xavotirli xabarlarga (avariya, buzilish, politsiya) bot hech qachon o'zi javob bermaydi. Masalan: /agents autoreply suggest",
"Планируется пробная неделя: если не подойдёт, вернём деньги за вычетом использованных дней. Точная формула будет в оферте.":"Sinov haftasi rejalashtirilgan: to'g'ri kelmasa, foydalanilgan kunlarni ayirib pulni qaytaramiz. Aniq formula ofertada bo'ladi.",
"Оплата через Click, Payme и другие способы появится позже, после запуска сервера.":"Click, Payme va boshqa usullar orqali to'lov keyinroq, server ishga tushgandan keyin paydo bo'ladi.",

  else if (per === '3m') { for (let i = 12; i >= 0; i--) { const e = new Date(r[1].getTime() - i * 7 * 864e5), s = new Date(e.getTime() - 7 * 864e5); buckets.push([String(e.getDate()) + '.' + (e.getMonth() + 1), (l) => { const t = new Date(l.date + 'T12:00:00'); return t > s && t <= e; }]); } }
  else { const n = Math.max(r[2], 1); for (let i = n - 1; i >= 0; i--) { const d = new Date(r[1].getTime() - i * 864e5), k = d.toISOString().slice(0, 10); buckets.push([String(d.getDate()), (l) => l.date === k]); } }
  const vals = buckets.map((b) => ls.filter(b[1]).reduce((a, l) => a + l.rate, 0)), mx = Math.max(1, ...vals), W = 100 / vals.length;
  const step = Math.ceil(buckets.length / 12);
  return '<svg viewBox="0 0 100 46" preserveAspectRatio="none" style="width:100%;height:150px;display:block">' + vals.map((v, i) => { const h = v / mx * 40; return '<rect x="' + (i * W + W * 0.15) + '" y="' + (42 - h) + '" width="' + (W * 0.7) + '" height="' + Math.max(h, 0.4) + '" rx="0.8" fill="var(--mint)" opacity="' + (i === vals.length - 1 ? 1 : 0.65) + '"><title>' + $m(v) + '</title></rect>'; }).join('') + '</svg>' +
    '<div style="display:grid;grid-template-columns:repeat(' + vals.length + ',1fr);font-size:10px;color:var(--muted);text-align:center">' + buckets.map((b, i) => '<span>' + (i % step === 0 ? b[0] : '') + '</span>').join('') + '</div>';
}
function opsGrossTips(cur, prev, ls) {

  const by = {}; ls.forEach((l) => { const b = by[l.driver] = by[l.driver] || []; b.push(l); });
  const arr = Object.keys(by).map((k) => [k, opsSum(by[k])]).filter((x) => x[1].n >= 2);
  if (arr.length > 1) {
    arr.sort((a, b) => b[1].rpm - a[1].rpm);
    out.push(['ok', 'Лучший RPM: ' + arr[0][0] + ' (' + $r(arr[0][1].rpm) + ').']);
    const low = arr[arr.length - 1]; out.push(['warn', 'Ниже всех RPM у ' + low[0] + ' (' + $r(low[1].rpm) + '). Ищите ему грузы дороже или короче.']);
    const dh = arr.slice().sort((a, b) => b[1].dhp - a[1].dhp)[0]; if (dh[1].dhp > 14) out.push(['warn', 'Больше всех пустых миль у ' + dh[0] + ': ' + Math.round(dh[1].dhp) + '% deadhead.']);
  }
  if (OPS.g.per === 'week' && OPS.g.by === 'all') { const left = OPS.goal - cur.gross; out.push([left <= 0 ? 'ok' : 'info', left <= 0 ? 'Недельная цель ' + $m(OPS.goal) + ' выполнена!' : 'До недельной цели осталось ' + $m(left) + '.']); }
  return out;
}

  if (d.opgoal) { OPS.goal = Math.max(1000, OPS.goal + +d.opgoal); opsSave(); render(); return true; }
  if (d.opedit) { OPS.gEdit = d.opedit; render(); return true; }
  if (d.opdel) { const p = d.opdel.split(':'); if (p[0] === 'd' && OPS.drivers.length > 1) OPS.drivers.splice(+p[1], 1); if (p[0] === 'p' && OPS.disps.length > 1) OPS.disps.splice(+p[1], 1); opsSave(); render(); return true; }
  const a = d.opact; if (!a) return false;
  if (a === 'copy') { const txt = opsFill(opsTplFor(OPS.d).body, OPS.d); try { navigator.clipboard.writeText(txt); toast('Текст скопирован'); } catch (e) { toast('Не получилось скопировать'); } return true; }
  if (a === 'send') { const c = opsCalc(); if (!OPS.d.no || OPS.d.stops.filter((s) => s.city).length < 2) { toast('Заполните номер груза и минимум 2 стопа'); return true; } OPS.sendSheet = true; render(); return true; }
  if (a === 'closesend') { OPS.sendSheet = false; render(); return true; }
  if (a === 'dosend') {
    const d0 = OPS.d, c = opsCalc(d0), st = d0.stops.filter((s) => s.city);
    const rec = { id:d0.editId || ('N' + Date.now().toString(36).toUpperCase()), no:d0.no, date:new Date().toISOString().slice(0, 10), driver:d0.driver, disp:d0.disp, from:st[0].city, to:st[st.length - 1].city, loaded:c.loaded, dh:c.dh, rate:c.rate, broker:d0.broker };
    OPS.extra = OPS.extra.filter((l) => l.id !== rec.id).concat([rec]); opsSave();
    OPS.sendSheet = false; OPS.d = opsBlank(); toast('Демо: груз отправлен водителю и добавлен в Gross board'); render(); return true;
  }
  if (a === 'rate') { OPS.showRate = !OPS.showRate; opsSave(); render(); return true; }
  if (a === 'newtpl') { const id = 't' + Date.now().toString(36); OPS.tpls.push({ id:id, name:'Мой шаблон', body:'Load #{load}\n{stops}\nDH {dh} mi · Loaded {loaded} mi' }); OPS.tplSel = id; opsSave(); render(); return true; }
  if (a === 'aitpl') { const id = 'ai' + Date.now().toString(36); OPS.tpls.push({ id:id, name:'Предложил ИИ', body:'🚛 Load #{load} — {driver} (Truck {unit})\n\n📍 {stops}\n\n🧭 DH {dh} mi → Loaded {loaded} mi (total {total})\n⏰ First stop: {pu_time}\n📝 {notes}\n\nReply 👍 when you start rolling.' }); OPS.tplSel = id; opsSave(); toast('ИИ предложил шаблон: проверьте и поправьте'); render(); return true; }
  if (a === 'defTpl') { OPS.tplDef = OPS.tplSel; opsSave(); render(); return true; }
  if (a === 'delTpl') { if (OPS.tpls.length > 1) { OPS.tpls = OPS.tpls.filter((t) => t.id !== OPS.tplSel); if (OPS.tplDef === OPS.tplSel) OPS.tplDef = OPS.tpls[0].id; OPS.tplSel = OPS.tplDef; opsSave(); } render(); return true; }
  if (a === 'closeedit') { OPS.gEdit = ''; render(); return true; }
  if (a === 'saveedit') {
    const e = {}; document.querySelectorAll('[data-ope]').forEach((el) => { const k = el.dataset.ope; e[k] = ['rate','loaded','dh'].indexOf(k) >= 0 ? (+el.value || 0) : el.value; });
    OPS.edits[OPS.gEdit] = Object.assign({}, OPS.edits[OPS.gEdit] || {}, e); OPS.gEdit = ''; opsSave(); toast('Груз сохранён, gross пересчитан'); render(); return true;
  }
  if (a === 'newload') { OPS.d = opsBlank(); S.view = 'dispatch'; render(); window.scrollTo(0, 0); return true; }
  if (a === 'adddrv') { const n = (document.getElementById('opsNewDrv') || {}).value, u = (document.getElementById('opsNewUnit') || {}).value; if (!n) { toast('Впишите имя'); return true; } OPS.drivers.push({ n:n.trim(), unit:(u || '—').trim(), loc:'', cdl:'2027-12-31', med:'2027-12-31' }); opsSave(); toast('Водитель добавлен'); render(); return true; }
  if (a === 'adddisp') { const n = (document.getElementById('opsNewDisp') || {}).value; if (!n) { toast('Впишите имя'); return true; } OPS.disps.push(n.trim()); opsSave(); toast('Диспетчер добавлен'); render(); return true; }
  if (a === 'remind') { toast('Демо: напоминание ушло водителю в группу'); return true; }
  if (a === 'brk') { const v = ((document.getElementById('opsMc') || {}).value || '').trim(); if (!v) { toast('Впишите MC или название'); return true; } OPS.brk = { mc:v, res:{ name:/^\d+$/.test(v) ? 'MC ' + v : v, age:4 + (v.length % 9), fac:['RTS','Triumph','OTR','WEX'][v.length % 4], pay:18 + (v.length % 15) } }; render(); return true; }
  return false;
}
document.addEventListener('input', (e) => {
  const el = e.target; if (!el || !el.dataset) return;
  if (el.dataset.opf) {
    const k = el.dataset.opf;
    if (k.indexOf('stop.') === 0) { const p = k.split('.'); OPS.d.stops[+p[1]][p[2]] = el.value; } else OPS.d[k] = el.value;
    opsRefresh(); return;
  }
  if (el.dataset.optbody !== undefined) { const t = OPS.tpls.filter((x) => x.id === OPS.tplSel)[0]; if (t) { t.body = el.value; opsSave(); const pv = document.getElementById('opsTplPrev'); if (pv) { const sample = { no:'1042', broker:'TQL', rate:'2450', driver:OPS.drivers[0].n, disp:OPS.disps[0], from:'Fontana, CA', notes:'Lumper paid by broker', dhO:'', ldO:'', stops:[{ t:'PU', fac:'Walmart DC #6031', city:'Fontana, CA', time:'11/27 08:00', ref:'4471023' },{ t:'DEL', fac:'Amazon PHX7', city:'Phoenix, AZ', time:'11/27 19:00', ref:'PO 88213' }] }; pv.textContent = opsFill(t.body, sample); } } return; }
  if (el.dataset.optname !== undefined) { const t = OPS.tpls.filter((x) => x.id === OPS.tplSel)[0]; if (t) { t.name = el.value; opsSave(); } }
});
document.addEventListener('change', (e) => {
  const el = e.target; if (!el || !el.dataset || !el.dataset.ops) return;
  const k = el.dataset.ops, v = el.value;
  if (v === '__add_driver') { S.view = 'people'; render(); return; }
  if (v === '__add_disp') { S.view = 'people'; render(); return; }
  OPS.d[k] = v;
  if (k === 'driver') { const dr = opsDriver(v); if (dr.loc) OPS.d.from = dr.loc; render(); return; }
  opsRefresh();
});
function opsAfterRender() {}
try { const v0 = new URLSearchParams(location.search).get('view'); if (v0 && VIEWS[v0]) S.view = v0; } catch (e) {}
try { window.OPS = OPS; } catch (e) {}

render();

/* for tests only: the app itself uses the private names above */
try { Object.assign(window, { S, go, render, VIEWS, LOADS, FAQ, nowParts, dayKey, nextSlot, trText, schedCheck }); } catch (e) {}
})();
</script>
