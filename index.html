<style>
:root{
  --bg:#0A101C;--side:#0D1424;--card:#121A2B;--raised:#182238;--line:#22304A;--line2:#1E2A42;
  --text:#EAF0FA;--sub:#C7D2E6;--muted:#93A3BF;--faint:#6F80A0;
  --mint:#3DDC97;--mint-t:#5BE3A8;--mint-bg:#123528;--mint-bd:#1F5A43;--on-mint:#06241A;
  --amber:#FFC266;--amber-bg:#3A2A10;--amber-bd:#5C4316;
  --red:#FF8A8A;--red-bg:#1C1215;--red-bd:#5A2A2E;
  --blue:#9DB8FF;--blue-bg:#1A2440;--blue-bd:#2C3B66;
  --violet:#C7B3FF;--violet-bg:#2A2140;--violet-bd:#45366B;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;font-family:'Space Grotesk',Inter,sans-serif;letter-spacing:-0.01em}
.app{min-height:100vh;display:flex}
.side{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh}
.content{flex:1;padding:18px 20px 96px;display:flex;flex-direction:column;gap:20px;max-width:560px;width:100%;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;height:calc(72px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--side);border-top:1px solid var(--line2);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));z-index:5}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:500;color:var(--muted)}
.tab.on{color:var(--mint);font-weight:600}
.tab svg{width:22px;height:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px}
.pad{padding:16px}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.muted{color:var(--muted)}.sub{color:var(--sub)}
.small{font-size:13px}.xs{font-size:12px}
.title{font-size:26px;font-weight:700}
.btn{height:48px;border-radius:14px;border:1px solid var(--line);background:var(--raised);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px}
.btn.primary{background:var(--mint);border-color:var(--mint);color:var(--on-mint);font-weight:700}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;border-color:var(--red-bd);color:var(--red)}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid}
.c-done{background:var(--mint-bg);color:var(--mint-t);border-color:var(--mint-bd)}
.c-dev{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-bd)}
.c-plan{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-bd)}
.c-disp{background:var(--violet-bg);color:var(--violet);border-color:var(--violet-bd)}
.c-gray{background:#1B2230;color:#AEB9CC;border-color:#2E3A50}
.pill{height:36px;padding:0 14px;border-radius:18px;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--sub)}
.pill.on{border-color:var(--mint);background:var(--mint-bg);color:var(--mint-t)}
.seg{height:48px;border-radius:14px;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--card)}
.seg.on{border-color:var(--mint);background:var(--mint-bg);color:var(--mint-t)}
.list>*{padding:13px 0;border-bottom:1px solid var(--line2)}
.list>*:last-child{border-bottom:0}
.listcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:2px 16px}
.icon{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.toggle{width:52px;height:32px;border-radius:16px;border:0;padding:0 4px;display:flex;align-items:center;flex:none;background:#2B3A57;justify-content:flex-start}
.toggle span{width:24px;height:24px;border-radius:50%;background:var(--muted)}
.toggle.on{background:var(--mint);justify-content:flex-end}
.toggle.on span{background:var(--on-mint)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;line-height:1.7;white-space:pre-line;background:var(--bg);border:1px solid var(--line2);border-radius:14px;padding:14px;color:#D6DFEE}
.back{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.faq{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.faq.open{border-color:var(--blue-bd);background:#141E33}
.faq button.q{width:100%;min-height:52px;padding:12px 14px;border:0;background:transparent;display:flex;align-items:center;gap:12px;text-align:left}
.sign{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;background:var(--raised);flex:none}
.faq.open .sign{background:var(--mint);color:var(--on-mint)}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.tbl{overflow-x:auto}
.trow{width:100%;display:grid;grid-template-columns:minmax(150px,1.2fr) 110px 140px minmax(180px,1.5fr) 140px;gap:12px;align-items:center;padding:12px 16px;text-align:left;border:0;border-bottom:1px solid var(--line2);background:transparent}
.trow.on{background:#172440;box-shadow:inset 0 0 0 1px var(--blue-bd)}
.thead{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.board{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.desk-only{display:none}
@media (min-width: 900px){
  .app.wide .side{display:flex;flex-direction:column;gap:18px;width:240px;flex:none;background:var(--side);border-right:1px solid var(--line2);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
  .app.wide .tabbar{display:none}
  .app.wide .content{max-width:1320px;padding:24px 28px 40px}
  .app.wide .desk-only{display:flex}
  .navbtn{height:42px;padding:0 12px;border-radius:12px;border:0;background:transparent;display:flex;align-items:center;gap:10px;font-size:15px;color:var(--sub);text-align:left;width:100%}
  .navbtn.on{background:#172440;color:var(--text);font-weight:700}
  .navbtn svg{width:18px;height:18px;flex:none}
}
</style>
</head>

function isWide() { return window.matchMedia('(min-width: 900px)').matches; }
function go(v) { S.view = v; render(); window.scrollTo(0, 0); }

function hh(h) { const v = ((h % 24) + 24) % 24; return (v < 10 ? '0' : '') + v + ':00'; }
function schedule() {
  const out = []; let n = 1;
  for (let t = 16 + S.interval; t < 16 + S.hours; t += S.interval) { out.push(['Апдейт ' + n, hh(t)]); n++; }
  out.push(['Итоговый апдейт', hh(16 + S.hours)]);
  return out;
}

}

    }).join('') +
    '<div class="card pad col" style="gap:12px;border-radius:18px;border-color:var(--amber-bd)"><div class="row"><span class="icon" style="width:40px;height:40px;background:var(--amber-bg);color:var(--amber);font-weight:700;font-size:14px">DC</span><div><div style="font-weight:600">Driver C</div><div class="small" style="color:var(--amber)">Бот не видит сообщения</div></div></div><div class="small sub" style="line-height:1.5">Сделайте бота администратором группы или удалите его из группы и добавьте снова.</div><button class="btn">Проверить ещё раз</button></div></div>' +
    '<div class="col" style="gap:10px"><div class="label">Как добавить группу</div><div class="card pad col" style="gap:14px;border-radius:18px">' +
      ['Откройте группу водителя в Telegram и добавьте туда бота.','Бот сам проверит, видит ли он сообщения, и напишет вам.','Группа появится здесь. Включите или выключите чтение переключателем.'].map((t, i) => '<div class="row" style="align-items:flex-start"><span class="icon" style="width:26px;height:26px;border-radius:50%;background:var(--raised);color:var(--mint-t);font-weight:700;font-size:13px">' + (i + 1) + '</span><span style="font-size:14px;line-height:1.45">' + t + '</span></div>').join('') + '</div></div>';
}

function vFeatures() {
  const all = [].concat.apply([], FEATURES.map((s) => s[1]));
  const n = (k) => all.filter((x) => x[2] === k).length;
  const filters = [['all','Все · ' + all.length],[D,'Есть · ' + n(D)],[W,'В разработке · ' + n(W)],[P,'План · ' + n(P)]];
  return head('Все функции', 'Что уже работает, что в разработке и что в плане. Все функции есть на любом тарифе.') +
    '<div class="wrap">' + filters.map((f) => '<button class="pill' + (S.feat === f[0] ? ' on' : '') + '" data-feat="' + f[0] + '">' + f[1] + '</button>').join('') + '</div>' +
    FEATURES.map((sec) => {
      const items = sec[1].filter((x) => S.feat === 'all' || x[2] === S.feat);
      if (!items.length) return '';
      return '<div class="col" style="gap:10px"><h3 style="font-size:17px">' + sec[0] + '</h3><div class="listcard list">' + items.map((x) => '<div class="row" style="align-items:flex-start"><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px;line-height:1.35">' + x[0] + '</div><div class="xs muted" style="margin-top:3px;line-height:1.45">' + x[1] + '</div></div><span class="chip ' + SM[x[2]][1] + '">' + SM[x[2]][0] + '</span></div>').join('') + '</div></div>';
    }).join('');
}

function vHelp() {
  const items = FAQ.map((x, i) => ['q' + (i + 1)].concat(x)).filter((x) => S.cat === 'all' || x[1] === S.cat);
  return head('Инструкция', FAQ.length + ' вопросов и ответов', 'settings') +
    '<div class="card pad col" style="gap:12px"><b>Быстрый старт за 3 шага</b>' + ['Нажмите /start и ответьте на 4 коротких вопроса.','Добавьте бота в группы водителей и подключите ELD.','В начале смены нажмите «Запустить смену».'].map((t, i) => '<div class="row" style="align-items:flex-start"><span class="icon" style="width:26px;height:26px;border-radius:50%;background:var(--mint);color:var(--on-mint);font-weight:700;font-size:13px">' + (i + 1) + '</span><span style="font-size:14px;line-height:1.45">' + t + '</span></div>').join('') + '</div>' +
    '<div class="wrap">' + FAQ_CATS.map((c) => '<button class="pill' + (S.cat === c[0] ? ' on' : '') + '" data-cat="' + c[0] + '">' + c[1] + '</button>').join('') + '</div>' +
    '<div class="col" style="gap:8px">' + items.map((x) => {
      const open = S.open === x[0];
      return '<div class="faq' + (open ? ' open' : '') + '"><button class="q" data-faq="' + x[0] + '" aria-expanded="' + open + '"><span style="flex:1;font-weight:600;font-size:14px;line-height:1.4">' + x[2] + '</span><span class="sign">' + (open ? '−' : '+') + '</span></button>' + (open ? '<div style="padding:0 14px 14px;font-size:13.5px;line-height:1.55;color:var(--sub)">' + x[3] + '</div>' : '') + '</div>';
    }).join('') + '</div>' +
    '<div class="card pad row" style="gap:14px;border-radius:18px"><div style="flex:1"><div style="font-weight:600">Не нашли ответ?</div><div class="small muted">Напишите владельцу командой /support</div></div><button class="btn primary" style="height:44px">Написать</button></div>';
}

function vSettings() {
  const nl = [['late','Груз опаздывает','Сразу, как только расчёт показал опоздание'],['silent','Водитель молчит','Если долго нет ответа в группе'],['group','Проблема с группой или ELD','Бот не видит чат или ключ перестал работать']];
  return '<h1 class="title">Настройки</h1>' +
    '<button class="card row" data-go="help" style="text-align:left;padding:16px;background:var(--mint-bg);border-color:var(--mint-bd)"><span class="icon" style="width:48px;height:48px;border-radius:14px;background:var(--mint)">' + ic('help', 24, '#06241A', 2.2) + '</span><span class="col" style="flex:1"><b style="font-size:16px">Инструкция и вопросы</b><span class="small" style="color:#C7E9D9">Как всё работает: ' + FAQ.length + ' ответов</span></span>' + ic('chev', 18, 'var(--mint-t)', 2) + '</button>' +
    '<div class="col" style="gap:10px"><div class="label">Язык бота</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">' + [['ru','RU'],['en','EN'],['tr','TR'],['uz','UZ']].map((l) => '<button class="seg' + (S.lang === l[0] ? ' on' : '') + '" data-lang="' + l[0] + '">' + l[1] + '</button>').join('') + '</div><div class="xs muted">' + (S.lang === 'tr' || S.lang === 'uz' ? 'Этот язык появится позже, пока бот ответит на русском' : 'Бот отвечает на этом языке') + '</div></div>' +
    '<div class="col" style="gap:10px"><div class="label">Смена по умолчанию</div><div class="listcard list">' + [['Время смены','16:00–23:00 (США)'],['Мой часовой пояс','Ташкент, UTC+5'],['Апдейт каждые','4 часа'],['Режим','Сначала показать мне']].map((r) => '<div class="row" style="justify-content:space-between"><span>' + r[0] + '</span><span class="small muted">' + r[1] + '</span></div>').join('') + '</div><div class="xs muted">В марте время смены сдвигается вместе с переходом США на летнее время.</div></div>' +
    '<div class="col" style="gap:10px"><div class="label">Подключения и команда</div><div class="listcard list"><div class="row" style="justify-content:space-between"><span>ELD · Samsara</span><span class="small" style="color:var(--mint-t)">Подключено (пример)</span></div><div class="row" style="justify-content:space-between"><span>Борд (Google Sheets)</span><span class="small muted">Update Board</span></div><div class="row" style="justify-content:space-between"><span>Тиммейты</span><span class="small muted">3 человека</span></div><div class="row" style="justify-content:space-between"><span>Amazon Relay</span><span class="chip c-plan">План</span></div></div></div>' +
    '<div class="col" style="gap:10px"><div class="label">Уведомления мне</div><div class="listcard list">' + nl.map((t) => '<div class="row"><span class="col" style="flex:1"><span>' + t[1] + '</span><span class="xs muted">' + t[2] + '</span></span><button class="toggle' + (S.notif[t[0]] ? ' on' : '') + '" data-notif="' + t[0] + '" aria-label="' + t[1] + '"><span></span></button></div>').join('') + '</div></div>' +
    '<div class="col" style="gap:10px"><div class="row" style="justify-content:space-between"><div class="label">Тариф и оплата</div><span class="chip c-plan">Скоро</span></div><div class="listcard list">' + [['Тариф','Старт · до 10 водителей'],['Пробная неделя','появится позже'],['Оплата','Click · Payme · другие'],['Оферта','готовится']].map((r) => '<div class="row" style="justify-content:space-between"><span>' + r[0] + '</span><span class="small muted">' + r[1] + '</span></div>').join('') + '</div><div class="xs muted">Тарифы отличаются только числом водителей. Оплата заработает после запуска сервера.</div></div>' +
    '<div class="xs" style="text-align:center;color:var(--faint)">Modenzo AI · демо-версия окна</div>';
}

function inTab(l, t) { return t === 'all' || (t === 'risk' ? (l.v === 'late' || l.v === 'tight') && l.st !== 'delivered' : l.st === t); }
function vBoard() {
  const q = S.q.toLowerCase();
  const tabs = [['all','Все'],['risk','Под риском'],['upcoming','Upcoming'],['dispatched','Dispatched'],['transit','In transit'],['delivered','Delivered']];
  const rows = LOADS.filter((l) => inTab(l, S.tab) && (!q || (l.id + ' ' + l.driver + ' ' + l.stop).toLowerCase().indexOf(q) >= 0));
  const sel = LOADS.find((l) => l.id === S.sel) || LOADS[0];
  const kpi = [['В пути', LOADS.filter((l) => l.st === 'transit').length, 'var(--text)'], ['Rolling', LOADS.filter((l) => l.truck === 'Rolling').length, 'var(--mint-t)'], ['Stopped', LOADS.filter((l) => l.truck === 'Stopped' && l.st !== 'delivered').length, 'var(--amber)'], ['Опаздывают', LOADS.filter((l) => l.v === 'late').length, 'var(--red)'], ['Upcoming', LOADS.filter((l) => l.st === 'upcoming').length, 'var(--blue)']];
  return '<div class="row" style="flex-wrap:wrap;gap:12px 16px"><div style="flex:1 1 240px">' + (isWide() ? '' : '<button class="back" data-go="home" aria-label="Назад" style="margin-bottom:10px">' + ic('back', 20, '#EAF0FA', 2) + '</button>') + '<h1 class="title" style="font-size:28px">Доска грузов</h1><div class="small muted">Пример данных. Нажмите на груз, чтобы открыть детали.</div></div>' +
    '<label class="card row" style="flex:0 1 280px;min-width:200px;height:44px;border-radius:12px;padding:0 12px;gap:8px">' + ic('search', 16, 'var(--muted)', 2) + '<input id="q" aria-label="Поиск по грузам" value="' + esc(S.q) + '" placeholder="Load, водитель, склад" style="flex:1;min-width:0;background:transparent;border:0;outline:none;font-size:14px"></label></div>' +
    (S.showNew ? '<div class="card row" style="flex-wrap:wrap;padding:12px 16px;border-radius:16px;background:#0F1A30;border-color:var(--blue-bd)"><span class="icon" style="width:36px;height:36px;border-radius:10px;background:var(--blue-bg);color:var(--blue)">' + ic('plus', 18, 'currentColor', 2) + '</span><span style="flex:1 1 240px;font-size:14px;line-height:1.45"><b>Новый груз 1231</b> появился в борде. Бот поставил статус Upcoming и ждёт назначения водителя.</span><button class="btn" style="height:40px;background:var(--blue);color:#0A1530;border:0" data-act="opennew">Показать</button><button class="btn ghost" style="height:40px;width:40px;padding:0" data-act="hidenew" aria-label="Скрыть">' + ic('x', 16, 'var(--blue)', 2) + '</button></div>' : '') +
    '<div class="kpis">' + kpi.map((k) => '<div class="card" style="padding:14px 16px;border-radius:16px"><h2 style="font-size:26px;color:' + k[2] + '">' + k[1] + '</h2><div class="small muted">' + k[0] + '</div></div>').join('') + '</div>' +
    '<div class="wrap" role="tablist">' + tabs.map((t) => '<button role="tab" aria-selected="' + (S.tab === t[0]) + '" class="pill' + (S.tab === t[0] ? ' on' : '') + '" data-tab="' + t[0] + '">' + t[1] + ' · ' + LOADS.filter((l) => inTab(l, t[0])).length + '</button>').join('') + '</div>' +
    '<div class="board"><div class="card" style="flex:999 1 800px;min-width:0;overflow:hidden"><div class="tbl"><div style="min-width:800px"><div class="trow thead" style="cursor:default"><span>Груз и водитель</span><span>Статус</span><span>Грузовик</span><span>Следующий стоп</span><span>ETA</span></div>' +
      (rows.length ? rows.map((l) => '<button class="trow' + (S.sel === l.id ? ' on' : '') + '" data-sel="' + l.id + '"><span class="col"><b style="font-size:14px">' + l.id + '</b><span class="xs muted">' + esc(l.driver) + '</span></span><span><span class="chip ' + ST[l.st][1] + '">' + ST[l.st][0] + '</span></span><span class="col"><span class="row" style="gap:6px;font-size:13px;font-weight:600;color:' + TC(l.truck) + '"><span class="dot" style="background:' + TC(l.truck) + '"></span>' + l.truck + '</span><span class="xs muted">' + esc(l.truckSub) + '</span></span><span class="col"><span style="font-size:13px;font-weight:600">' + esc(l.stop) + '</span><span class="xs muted">' + l.appt + '</span></span><span class="col"><span style="font-size:13px;font-weight:600">' + l.eta + '</span><span class="xs" style="font-weight:600;color:' + VC[l.v] + '">' + l.verdict + '</span></span></button>').join('') : '<div class="small muted" style="padding:28px;text-align:center">Нет грузов с таким статусом</div>') +
    '</div></div></div>' +
    '<div class="card col" style="flex:1 1 300px;min-width:0;padding:18px;gap:16px"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><h2 style="font-size:22px">Load ' + sel.id + '</h2><div class="small muted">' + esc(sel.driver) + ' · трак ' + sel.truckNo + '</div></div><span class="chip ' + ST[sel.st][1] + '">' + ST[sel.st][0] + '</span></div>' +
      '<div class="grid2"><div style="background:var(--bg);border:1px solid var(--line2);border-radius:14px;padding:10px 12px"><div class="xs muted">Грузовик</div><b style="font-size:14px;color:' + TC(sel.truck) + '">' + sel.truck + '</b><div class="xs muted">' + esc(sel.truckSub) + '</div></div><div style="background:var(--bg);border:1px solid var(--line2);border-radius:14px;padding:10px 12px"><div class="xs muted">Вердикт ETA</div><b style="font-size:14px;color:' + VC[sel.v] + '">' + sel.verdict + '</b><div class="xs muted">' + sel.eta + '</div></div></div><div class="row small" style="justify-content:space-between"><span class="muted">Осталось вождения</span><b>' + sel.hos + '</b></div>' +
      '<div class="col" style="gap:8px"><div class="label" style="font-size:11px">Стопы</div>' + stopsHtml(sel.stops) + '</div>' +
      '<div class="col" style="gap:8px"><div class="label" style="font-size:11px">Последнее из группы</div>' + (sel.msgs.length ? sel.msgs.map((m) => '<div style="background:var(--bg);border:1px solid var(--line2);border-radius:12px;padding:10px 12px" class="col"><div class="row xs muted" style="justify-content:space-between"><span>' + esc(m[0]) + '</span><span>' + m[1] + '</span></div><div class="small" style="line-height:1.45;margin-top:4px">' + esc(m[2]) + '</div>' + (m[3] ? '<div class="xs" style="color:var(--blue);margin-top:4px">' + esc(m[3]) + '</div>' : '') + '</div>').join('') : '<div class="small muted">Сообщений по этому грузу пока нет</div>') + '</div>' +
      '<div class="grid2"><button class="btn primary" style="height:44px;font-size:14px" data-go="updates">Подготовить апдейт</button><button class="btn" style="height:44px;font-size:14px" data-go="eta">Разбор ETA</button></div></div></div>' +
    '<div class="xs" style="color:var(--faint)">Статусы грузов будут браться из борда, позже из Amazon Relay; Rolling и Stopped из ELD.</div>';
}

function vDrivers() {
  return head('Водители', 'Кто едет, кто стоит и сколько часов вождения осталось. Пример данных.', isWide() ? '' : 'home') +
    '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px">' + LOADS.filter((l) => l.truckNo !== '—').map((l) => {
      const c = l.hosPct < 35 ? 'var(--red)' : (l.hosPct < 60 ? 'var(--amber)' : 'var(--mint)');
      return '<div class="card pad col" style="gap:12px;border-radius:18px"><div class="row"><span class="icon" style="width:42px;height:42px;border-radius:12px;background:var(--raised);font-weight:700;font-size:14px">' + l.driver.split(' ').map((w) => w[0]).join('') + '</span><div style="flex:1;min-width:0"><div style="font-weight:600">' + esc(l.driver) + '</div><div class="xs muted">Трак ' + l.truckNo + ' · Load ' + l.id + '</div></div><span class="row xs" style="gap:6px;font-weight:600;color:' + TC(l.truck) + '"><span class="dot" style="background:' + TC(l.truck) + '"></span>' + l.truck + '</span></div><div class="small sub">' + esc(l.truckSub) + '</div><div class="col" style="gap:6px"><div class="row xs muted" style="justify-content:space-between"><span>Осталось вождения</span><b style="color:var(--text)">' + l.hos + '</b></div><div style="height:6px;border-radius:3px;background:var(--line);overflow:hidden"><div style="height:100%;width:' + l.hosPct + '%;background:' + c + '"></div></div></div></div>';
    }).join('') + '</div>';
}

const VIEWS = { home:vHome, shift:vShift, updates:vUpdates, eta:vEta, groups:vGroups, features:vFeatures, help:vHelp, settings:vSettings, board:vBoard, drivers:vDrivers };
const TABS = [['home','Главная','home'],['updates','Апдейты','send'],['groups','Группы','users'],['features','Функции','grid'],['settings','Настройки','sliders']];
const NAV = [['home','Главная','home'],['board','Доска грузов','truck'],['drivers','Водители','wheel'],['updates','Апдейты','send'],['eta','Расчёт ETA','pin'],['groups','Группы','users'],['features','Все функции','grid'],['help','Инструкция','help'],['settings','Настройки','sliders']];
const TAB_OF = { shift:'home', eta:'home', board:'home', drivers:'home', help:'settings' };

function render() {
  const app = document.getElementById('app');
  app.className = 'app' + (isWide() ? ' wide' : '');
  const active = TAB_OF[S.view] || S.view;
  const side = '<aside class="side"><div class="row" style="gap:10px;padding:0 6px">' + LOGO + '<div><h2 style="font-size:18px">Modenzo AI</h2><div class="xs muted">Расширенный экран</div></div></div><nav class="col" style="gap:4px" aria-label="Разделы">' +
    NAV.map((n) => '<button class="navbtn' + (S.view === n[0] ? ' on' : '') + '" data-go="' + n[0] + '">' + ic(n[2], 18) + n[1] + '</button>').join('') + '</nav>' +
    '<div class="col" style="margin-top:auto;gap:8px"><div class="card col" style="padding:12px;border-radius:16px;gap:4px;border-color:' + (S.launched ? 'var(--mint-bd)' : 'var(--amber-bd)') + '"><span class="xs" style="font-weight:600;color:' + (S.launched ? 'var(--mint-t)' : 'var(--amber)') + '">' + (S.launched ? 'Смена идёт' : 'Смена не запущена') + '</span><span class="small sub">16:00–' + hh(16 + S.hours) + ' (время США)</span></div><div class="xs" style="color:var(--faint);padding:0 6px">Демо · данные примерные</div></div></aside>';
  const tabbar = '<nav class="tabbar" aria-label="Разделы">' + TABS.map((t) => '<button class="tab' + (active === t[0] ? ' on' : '') + '" data-go="' + t[0] + '">' + ic(t[2], 22, 'currentColor', 1.8) + t[1] + '</button>').join('') + '</nav>';
  app.innerHTML = side + '<div class="main"><div class="content">' + VIEWS[S.view]() + '</div>' + tabbar + '</div>';
  const q = document.getElementById('q');
  if (q) q.addEventListener('input', (e) => { S.q = e.target.value; const pos = e.target.selectionStart; render(); const n = document.getElementById('q'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } });
  if (tg && tg.BackButton) { try { if (S.view !== 'home') tg.BackButton.show(); else tg.BackButton.hide(); } catch (e) {} }
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  const d = b.dataset;
  if (d.go) return go(d.go);
  if (d.hours) S.hours = +d.hours;
  else if (d.interval) S.interval = +d.interval;
  else if (d.mode) S.mode = d.mode;
  else if (d.upd) S.upd = d.upd;
  else if (d.group) S.groups[d.group] = !S.groups[d.group];
  else if (d.feat) S.feat = d.feat;
  else if (d.cat) S.cat = d.cat;
  else if (d.faq) S.open = S.open === d.faq ? '' : d.faq;
  else if (d.lang) S.lang = d.lang;
  else if (d.notif) S.notif[d.notif] = !S.notif[d.notif];
  else if (d.tab) S.tab = d.tab;
  else if (d.sel) S.sel = d.sel;
  else if (d.act === 'launch') { S.launched = true; if (tg && tg.HapticFeedback) try { tg.HapticFeedback.notificationOccurred('success'); } catch (x) {} }
  else if (d.act === 'stop') S.launched = false;
  else if (d.act === 'opennew') { S.tab = 'upcoming'; S.sel = '1231'; S.showNew = false; }
  else if (d.act === 'hidenew') S.showNew = false;
  else return;
  render();
});
if (tg && tg.BackButton) { try { tg.BackButton.onClick(() => go(TAB_OF[S.view] && S.view !== 'help' ? 'home' : (S.view === 'help' ? 'settings' : 'home'))); } catch (e) {} }
window.addEventListener('resize', () => render());
render();
</script>
</body>
</html>
